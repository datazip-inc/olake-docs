apiVersion: batch/v1
kind: CronJob
metadata:
  name: olake-sync
  namespace: olake
spec:
  # Run every 5 minutes
  schedule: '*/5 * * * *'
  suspend: true # TODO: Set this to false in production
  concurrencyPolicy: Forbid # This is to prevent multiple jobs from running simultaneously
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 5
      template:
        spec:
          # Optional: pin the sync to nodes with a label. Uncomment and set the key and value.
          # affinity:
          #   nodeAffinity:
          #     requiredDuringSchedulingIgnoredDuringExecution:
          #       nodeSelectorTerms:
          #         - matchExpressions:
          #             - key: <label-key>
          #               operator: In
          #               values:
          #                 - <label-value>
          containers:
            - name: olake
              image: olakego/source-mongodb:v1.2.2 # TODO: set the image and version for your source
              imagePullPolicy: Always
              command: ['/bin/sh', '-c']
              # OLake Go writes state.json next to source.json on the PVC after each run.
              # Pass --state only once that file exists: a fresh pipeline then starts with the
              # current state version, and later runs resume from the saved state.
              args:
                - |
                  STATE=""
                  [ -s /mnt/config/state.json ] && STATE="--state /mnt/config/state.json"
                  exec /home/olake sync \
                    --config /mnt/config/source.json \
                    --selected-streams /mnt/config/selected_streams.json \
                    --available-streams /mnt/config/available_streams.json \
                    --destination /mnt/config/destination.json $STATE
              volumeMounts:
                - name: config-volume
                  mountPath: /mnt/config
              resources: # Size these to your source and the max_threads in source.json
                requests:
                  cpu: '4'
                  memory: '8Gi'
                limits:
                  memory: '16Gi'

          # initContainer to copy the config files from the ConfigMaps to the PVC.
          # It does not touch state.json, so the saved state survives between runs.
          initContainers:
            - name: init-config
              image: busybox
              command: ['sh', '-c']
              args:
                - |
                  cp /etc/source/source.json /mnt/shared/source.json && 
                  cp /etc/catalog/available_streams.json /mnt/shared/available_streams.json && 
                  cp /etc/catalog/selected_streams.json /mnt/shared/selected_streams.json && 
                  cp /etc/writer/destination.json /mnt/shared/destination.json
              volumeMounts:
                - name: source-config-volume
                  mountPath: /etc/source
                  readOnly: true
                - name: streams-config-volume
                  mountPath: /etc/catalog
                  readOnly: true
                - name: destination-config-volume
                  mountPath: /etc/writer
                  readOnly: true
                - name: config-volume
                  mountPath: /mnt/shared
          volumes:
            - name: source-config-volume
              configMap:
                name: olake-source-config
                items:
                  - key: source.json
                    path: source.json
            - name: streams-config-volume
              configMap:
                name: olake-streams-config
                items:
                  - key: available_streams.json
                    path: available_streams.json
                  - key: selected_streams.json
                    path: selected_streams.json
            - name: destination-config-volume
              configMap:
                name: olake-destination-config
                items:
                  - key: destination.json
                    path: destination.json
            - name: config-volume
              persistentVolumeClaim:
                claimName: olake-config-pvc
          restartPolicy: Never

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: olake-config-pvc
  namespace: olake
spec:
  accessModes:
    - ReadWriteMany # Allows multiple pods to use it simultaneously
  resources:
    requests:
      storage: 1Gi
  # TODO: set a StorageClass that supports ReadWriteMany (list them with `kubectl get storageclass`):
  #   AKS: azurefile-csi (Azure Files)
  #   GKE: a Filestore CSI class such as standard-rwx
  #   EKS: an EFS CSI class (provisioner efs.csi.aws.com)
  storageClassName: change-me-rwx-storage-class
