apiVersion: v1
kind: ConfigMap
metadata:
  name: olake-streams-config # You can change this name if needed
  namespace: olake
data:
  # Replace with the available_streams.json generated by discover; do not edit.
  available_streams.json: |
    {
      "streams": [
        {
          "stream": {
            "name": "stream_0",
            "namespace": "otter_db",
            "type_schema": {
              "properties": {
                "id": { "type": ["integer"] }
              }
            },
            "supported_sync_modes": ["full_refresh", "incremental"],
            "source_defined_primary_key": ["id"],
            "available_cursor_fields": ["id"],
            "sync_mode": "full_refresh"
          }
        },
        {
          "stream": {
            "name": "stream_8",
            "namespace": "otter_db",
            "type_schema": {
              "properties": {
                "id": { "type": ["integer"] }
              }
            },
            "supported_sync_modes": ["full_refresh", "incremental"],
            "source_defined_primary_key": ["id"],
            "available_cursor_fields": ["id"],
            "sync_mode": "full_refresh"
          }
        }
      ]
    }
  # partition_regex uses the Iceberg syntax, for example "/{created_at, day}" or
  # "/{created_at, day}/{region, identity}". Leave it empty for an unpartitioned table.
  selected_streams.json: |
    {
      "selected_streams": {
        "otter_db": [
          {
            "partition_regex": "",
            "stream_name": "stream_0",
            "normalization": false,
            "append_mode": false,
            "sync_mode": "full_refresh"
          },
          {
            "partition_regex": "",
            "stream_name": "stream_8",
            "normalization": false,
            "append_mode": false,
            "sync_mode": "full_refresh"
          }
        ]
      }
    }
