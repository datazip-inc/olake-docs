# Service test: the Airbyte SQL Server source connector and a column added to a CDC-enabled table.
# One SQL Server with the Agent on. No host port is published: every statement runs through sqlcmd
# inside the container, and the connector runs as a one-off container on this network.
# The SQL Server image is x86-64 only. On Apple silicon it runs emulated.
name: rbt-abt-mssql

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04
    platform: linux/amd64
    hostname: mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Lab_Passw0rd_2026
      MSSQL_AGENT_ENABLED: "true"
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Lab_Passw0rd_2026 -C -Q 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 60
