# Service test: the Airbyte MySQL source connector and a binary log position that was purged.
# One MySQL server. No host port is published. The connector runs as a one-off container on this
# network.
#
#   GTID=ON ./run.sh all      the same run with gtid_mode=ON
name: rbt-abt-mysql

services:
  source:
    image: mysql:8.4.13
    hostname: source
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --gtid-mode=${GTID:-OFF}
      - --enforce-gtid-consistency=${GTID:-OFF}
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -uroot -prootpw -e 'SELECT 1 FROM inventory.customers LIMIT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 60
