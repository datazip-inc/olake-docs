# Service test: the Airbyte PostgreSQL source connector and a replication slot.
# Two PostgreSQL servers with the same content, so that the two test series do not share a WAL:
#   pg    the slot between two syncs, and a saved position that is no longer usable
#   pgq   a slot in a database that is not written to, while another database is busy
# No host port is published. The connector runs as a one-off container on this network.
name: rbt-abt-pg

services:
  pg: &pg
    image: postgres:18.7
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_PASSWORD: labpw
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d quietdb"]
      interval: 2s
      timeout: 3s
      retries: 60
  pgq:
    <<: *pg
