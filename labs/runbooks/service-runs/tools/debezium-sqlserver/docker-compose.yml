# Runs for the page "Enable SQL Server CDC and fix empty change tables": what the Debezium SQL Server
# connector does when SQL Server Agent is not running, and when a column is added to a captured table.
# Only the Kafka Connect REST port is published.
# The SQL Server image is x86-64 only. On Apple silicon it runs emulated and needs Rosetta enabled in
# Docker Desktop.
name: rbt-dbz-mssql

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04
    platform: linux/amd64
    # A fixed host name: the Agent jobs record the server name, and the container is created twice
    # (first with the Agent off, then with it on) over the same data volume.
    hostname: mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Lab_Passw0rd_2026
      MSSQL_AGENT_ENABLED: "${AGENT:-false}"
    volumes:
      - mssql-data:/var/opt/mssql
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Lab_Passw0rd_2026 -C -Q 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 60

  kafka:
    image: apache/kafka:4.3.1
    mem_limit: 704m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx320m
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx96m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  connect:
    image: quay.io/debezium/connect:3.7.1.Final
    mem_limit: 1408m
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${CONNECT_PORT:-18311}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: rbt-connect
      CONFIG_STORAGE_TOPIC: rbt_connect_configs
      OFFSET_STORAGE_TOPIC: rbt_connect_offsets
      STATUS_STORAGE_TOPIC: rbt_connect_statuses
      OFFSET_FLUSH_INTERVAL_MS: 10000
      HEAP_OPTS: -Xms256M -Xmx640M

volumes:
  mssql-data:
