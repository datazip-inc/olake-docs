# Second stack for the lab: two Kafka Connect workers in one group.
# By default both advertise "localhost", the usual container mistake: a worker that is not the
# leader then cannot hand its task configurations to the leader. Set ADVERTISED_1 and ADVERTISED_2
# to names the workers can resolve to fix it.
name: dbz-running-two-workers

x-connect: &connect
  image: quay.io/debezium/connect:3.7.1.Final
  mem_limit: 1024m
  depends_on:
    kafka:
      condition: service_healthy
    postgres:
      condition: service_healthy

x-connect-env: &connect-env
  BOOTSTRAP_SERVERS: kafka:9092
  GROUP_ID: lab-connect-pair
  CONFIG_STORAGE_TOPIC: lab_pair_configs
  OFFSET_STORAGE_TOPIC: lab_pair_offsets
  STATUS_STORAGE_TOPIC: lab_pair_statuses
  OFFSET_FLUSH_INTERVAL_MS: 10000
  HEAP_OPTS: -Xms256M -Xmx448M

services:
  kafka:
    image: apache/kafka:4.3.1
    mem_limit: 704m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx320m
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx96m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  postgres:
    image: postgres:16
    mem_limit: 224m
    command: ["postgres", "-c", "wal_level=logical", "-c", "shared_buffers=32MB"]
    environment:
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: inventory
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d inventory -c 'SELECT 1 FROM public.orders LIMIT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40

  connect-1:
    <<: *connect
    ports:
      - "${CONNECT_PORT:-18083}:8083"
    environment:
      <<: *connect-env
      ADVERTISED_HOST_NAME: "${ADVERTISED_1:-localhost}"

  connect-2:
    <<: *connect
    ports:
      - "${CONNECT_PORT_2:-18084}:8083"
    environment:
      <<: *connect-env
      ADVERTISED_HOST_NAME: "${ADVERTISED_2:-localhost}"
