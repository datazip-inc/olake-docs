# Lab: enabling change data capture (CDC) on SQL Server, and change tables that stay empty.
# No port is published: every step runs sqlcmd inside the container.
# The image is x86-64 only. On Apple silicon it runs emulated and needs Rosetta enabled in Docker Desktop.
name: mssql-cdc-change-tables-empty

services:
  mssql:
    image: ${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2022-CU27-GDR1-ubuntu-22.04}
    platform: linux/amd64
    # A fixed host name: the Agent jobs record the server name, and the container is created twice
    # (first with the Agent off, then with it on) over the same data volume.
    hostname: mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Lab_Passw0rd_2026
      MSSQL_AGENT_ENABLED: "${AGENT:-false}"
    volumes:
      - mssql-data:/var/opt/mssql
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "S=/opt/mssql-tools18/bin/sqlcmd; [ -x $$S ] || S=/opt/mssql-tools/bin/sqlcmd; $$S -S localhost -U sa -P Lab_Passw0rd_2026 -C -Q 'SELECT 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 60

volumes:
  mssql-data:
