# Lab: turn on logical replication for change data capture (CDC) on a self-hosted PostgreSQL,
# one prerequisite at a time, and see the error each missing prerequisite produces.
# The server starts with its defaults (wal_level = replica). No host port is published.
#
#   PG_VERSION=13.23 ./run.sh up      another PostgreSQL version (default 18.7)
name: pg-enable-logical-replication

services:
  pg:
    image: postgres:${PG_VERSION:-18.7}
    environment:
      POSTGRES_PASSWORD: labpw
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d appdb"]
      interval: 2s
      timeout: 3s
      retries: 60
