# Lab: Kafka Connect cannot find a connector class.
# The worker is plain Apache Kafka Connect, started from a properties file that run.sh writes
# into ./work, so plugin.path is the only thing that changes between steps.
# Nothing is published on the host except the Kafka Connect REST port.
name: kc-connector-class-not-found

services:
  kafka:
    image: apache/kafka:4.3.1
    mem_limit: 704m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx320m
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx96m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    mem_limit: 224m
    command: ["postgres", "-c", "wal_level=logical", "-c", "shared_buffers=32MB"]
    environment:
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: inventory
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d inventory -c 'SELECT 1 FROM public.customers LIMIT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40

  connect:
    # Any image that ships the Kafka distribution works. KAFKA_DIR is where it is unpacked.
    image: ${CONNECT_IMAGE:-apache/kafka:4.3.1}
    mem_limit: 1536m
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c", "exec ${KAFKA_DIR:-/opt/kafka}/bin/connect-distributed.sh /lab/worker.properties"]
    environment:
      KAFKA_HEAP_OPTS: -Xms256M -Xmx768M
      KAFKA_LOG4J_OPTS: "${CONNECT_LOG4J_OPTS:-}"
    volumes:
      - ./work:/lab
    ports:
      - "${CONNECT_PORT:-18083}:8083"
