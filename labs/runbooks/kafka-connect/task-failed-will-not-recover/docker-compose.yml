# Lab: a Kafka Connect task is killed by one bad record.
# The sink is the file sink that ships with Apache Kafka, so the failure comes from the framework
# and not from one vendor's connector. PostgreSQL is only used by the put-failure step.
# Nothing is published on the host except the Kafka Connect REST port.
name: kc-task-failed-will-not-recover

services:
  kafka:
    image: apache/kafka:4.3.1
    mem_limit: 704m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms256m -Xmx320m
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx96m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    mem_limit: 224m
    command: ["postgres", "-c", "shared_buffers=32MB"]
    environment:
      POSTGRES_PASSWORD: postgrespw
      POSTGRES_DB: inventory
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d inventory -c 'SELECT 1 FROM public.orders_jdbc LIMIT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40

  connect:
    image: ${CONNECT_IMAGE:-quay.io/debezium/connect:3.7.1.Final}
    mem_limit: 1536m
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${CONNECT_PORT:-18083}:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: lab-errors
      CONFIG_STORAGE_TOPIC: lab_errors_configs
      OFFSET_STORAGE_TOPIC: lab_errors_offsets
      STATUS_STORAGE_TOPIC: lab_errors_statuses
      OFFSET_FLUSH_INTERVAL_MS: 5000
      HEAP_OPTS: -Xms256M -Xmx768M
      # The file connectors that ship with Kafka have not been on the plugin path by default
      # since Kafka 3.1.1, so the jar is added here.
      CONNECT_PLUGIN_PATH: "/kafka/connect,/kafka/libs/connect-file-${KAFKA_VERSION:-4.3.1}.jar"
