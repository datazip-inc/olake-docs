# Warnings and errors, plus the INFO line of each Iceberg commit and of the rewrite action, on stderr.
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss.SSS} %p %c: %m%n%ex
logger.actions.name = org.apache.iceberg.spark.actions
logger.actions.level = info
logger.commit.name = org.apache.iceberg.SnapshotProducer
logger.commit.level = info
