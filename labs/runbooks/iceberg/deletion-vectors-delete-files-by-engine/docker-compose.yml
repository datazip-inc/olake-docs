# Lab: which engine reads which Iceberg delete format, on format version 2 and 3 tables.
# MinIO holds the data and the Iceberg REST catalog test fixture holds the table metadata. Three Spark
# versions, PyIceberg and Trino write tables to the same catalog and then read each other's tables, one
# engine at a time: every engine is behind a profile, and run.sh starts one, runs it and stops it before
# the next. No host port is published.
# Memory limits: 448m + 64m + 320m, plus one of Spark 2g, PyIceberg 768m or Trino 1792m.
name: iceberg-deletion-vectors-delete-files

services:
  minio:
    image: olakego/minio:RELEASE.2025-04-03T14-56-28Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
      GOMEMLIMIT: 320MiB
    mem_limit: 448m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30

  # One-shot: creates the bucket, then exits.
  mc:
    image: olakego/mc:RELEASE.2025-04-03T17-07-56Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["sh", "-c", "mc alias set local http://minio:9000 admin password && mc mb -p local/warehouse"]
    mem_limit: 64m

  rest:
    image: apache/iceberg-rest-fixture:1.10.1
    depends_on:
      mc:
        condition: service_completed_successfully
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    mem_limit: 320m

  # The three Spark versions. run.sh starts each one with docker compose run for one spark-submit.
  spark35:
    image: apache/spark:3.5.6-scala2.12-java17-python3-ubuntu
    profiles: ["spark"]
    user: root
    depends_on:
      - rest
    environment: &aws
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    volumes: &lab
      - .:/lab:ro
      - ivy:/ivy
    mem_limit: 2g

  spark40:
    image: apache/spark:4.0.5-scala2.13-java17-python3-ubuntu
    profiles: ["spark"]
    user: root
    depends_on:
      - rest
    environment: *aws
    volumes: *lab
    mem_limit: 2g

  spark33:
    image: apache/spark:3.3.3-scala2.12-java11-python3-ubuntu
    profiles: ["spark"]
    user: root
    depends_on:
      - rest
    environment: *aws
    volumes: *lab
    mem_limit: 2g

  # PyIceberg is installed with pip at run time, in the version run.sh asks for.
  pyiceberg:
    image: python:3.12.16-slim-bookworm
    profiles: ["pyiceberg"]
    depends_on:
      - rest
    volumes:
      - .:/lab:ro
    mem_limit: 768m

  trino:
    image: trinodb/trino:484
    profiles: ["trino"]
    depends_on:
      - rest
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
    mem_limit: 1792m

volumes:
  ivy:
