<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background: transparent; font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', 'Fira Code', Consolas, monospace;">
  
  <!-- Definitions for ambient glows & gradients -->
  <defs>
    <!-- Dark Card Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F12" />
      <stop offset="100%" stop-color="#0A0A0C" />
    </linearGradient>

    <!-- Node Glow Effect -->
    <filter id="blueGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Radial Soft Glow for Hubs -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- MAIN CARD CONTAINER -->
  <rect x="10" y="10" width="940" height="460" rx="16" fill="url(#bgGrad)" stroke="#2B2D3A" stroke-width="2" />

  <!-- AMBIENT BACKGROUND GLOWS BEHIND HUBS -->
  <circle cx="365" cy="250" r="120" fill="url(#ambientGlow)" />
  <circle cx="805" cy="250" r="120" fill="url(#ambientGlow)" />

  <!-- COLUMN HEADERS -->
  <text x="200" y="55" fill="#9CA3AF" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">SOURCES</text>
  <text x="520" y="55" fill="#9CA3AF" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">DESTINATIONS</text>
  <text x="805" y="55" fill="#9CA3AF" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">TABLE OPTIMISATION</text>

  <!-- CONNECTIONS: SOURCES TO OLAKE GO (Prominent Line Color & Stroke Width) -->
  <g stroke="#4B5563" stroke-width="2" fill="none" opacity="0.9">
    <path d="M 150,110 C 240,110 260,250 340,250" />
    <path d="M 150,150 C 230,150 260,250 340,250" />
    <path d="M 150,190 C 220,190 260,250 340,250" />
    <path d="M 150,230 C 210,230 260,250 340,250" />
    <path d="M 150,270 C 210,270 260,250 340,250" />
    <path d="M 150,310 C 220,310 260,250 340,250" />
    <path d="M 150,350 C 230,350 260,250 340,250" />
    <path d="M 150,390 C 240,390 260,250 340,250" />
  </g>

  <!-- SOURCE LABELS & ENDPOINT DOTS -->
  <g font-size="12" font-weight="500" fill="#F3F4F6">
    <text x="135" y="114" text-anchor="end">Postgres</text>
    <circle cx="150" cy="110" r="4" fill="#60A5FA" />

    <text x="135" y="154" text-anchor="end">MongoDB</text>
    <circle cx="150" cy="150" r="4" fill="#60A5FA" />

    <text x="135" y="194" text-anchor="end">MySQL</text>
    <circle cx="150" cy="190" r="4" fill="#60A5FA" />

    <text x="135" y="234" text-anchor="end">Kafka</text>
    <circle cx="150" cy="230" r="4" fill="#60A5FA" />

    <text x="135" y="274" text-anchor="end">S3</text>
    <circle cx="150" cy="270" r="4" fill="#60A5FA" />

    <text x="135" y="314" text-anchor="end">Oracle</text>
    <circle cx="150" cy="310" r="4" fill="#60A5FA" />

    <text x="135" y="354" text-anchor="end">MSSQL</text>
    <circle cx="150" cy="350" r="4" fill="#60A5FA" />

    <text x="135" y="394" text-anchor="end">DB2 LUW</text>
    <circle cx="150" cy="390" r="4" fill="#60A5FA" />
  </g>

  <!-- CENTER NODE 1: OLake Go -->
  <g transform="translate(340, 225)">
    <rect x="0" y="0" width="50" height="50" rx="12" fill="#0D1322" stroke="#3B82F6" stroke-width="2" filter="url(#blueGlow)" />
    <!-- Wave Icon -->
    <path d="M 14,18 Q 25,12 36,18 M 14,25 Q 25,19 36,25 M 14,32 Q 25,26 36,32" fill="none" stroke="#60A5FA" stroke-width="2.2" stroke-linecap="round" />
    <text x="25" y="68" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">OLake Go</text>
  </g>

  <!-- CONNECTIONS: OLAKE GO TO DESTINATIONS -->
  <g stroke="#4B5563" stroke-width="2" fill="none" opacity="0.9">
    <!-- From OLake Go to Iceberg tables dot (Left of text) -->
    <path d="M 390,250 C 430,250 450,180 495,180" />
    <!-- From OLake Go to Parquet on S3 -->
    <path d="M 390,250 C 430,250 450,320 495,320" />
  </g>

  <!-- LOOP CURVES: BETWEEN 'S' OF ICEBERG TABLES AND OLAKE FUSION -->
  <g stroke="#4B5563" stroke-width="2" fill="none" opacity="0.9">
    <!-- Curve 1: From 's' of Iceberg tables -> OLake Fusion (Top connector, no middle dot) -->
    <path d="M 625,180 C 665,110 740,160 780,242" />
    <!-- Curve 2: From OLake Fusion (Bottom connector with dot) -> back to 's' of Iceberg tables -->
    <path d="M 780,258 C 740,300 665,260 625,180" />
  </g>

  <!-- DESTINATION LABELS & DOTS -->
  <g font-size="13" font-weight="500" fill="#F3F4F6">
    <!-- Iceberg tables Input Dot -->
    <circle cx="495" cy="180" r="4" fill="#60A5FA" />
    
    <!-- Text: Iceberg tables -->
    <text x="510" y="184">Iceberg tables</text>

    <!-- Dot right at the 's' of Iceberg tables -->
    <circle cx="625" cy="180" r="4" fill="#60A5FA" />

    <!-- Dot where lower curve touches OLake Fusion -->
    <circle cx="780" cy="258" r="4" fill="#60A5FA" />

    <!-- Parquet on S3 -->
    <circle cx="495" cy="320" r="4" fill="#60A5FA" />
    <text x="508" y="324">Parquet on S3</text>
  </g>

  <!-- CENTER NODE 2: OLake Fusion -->
  <g transform="translate(780, 225)">
    <rect x="0" y="0" width="50" height="50" rx="12" fill="#0D1322" stroke="#3B82F6" stroke-width="2" filter="url(#blueGlow)" />
    <!-- Spiral Contour Icon -->
    <ellipse cx="25" cy="25" rx="15" ry="11" fill="none" stroke="#2563EB" stroke-width="1.8" />
    <ellipse cx="25" cy="25" rx="10" ry="7" fill="none" stroke="#3B82F6" stroke-width="1.8" />
    <ellipse cx="25" cy="25" rx="5" ry="3" fill="none" stroke="#93C5FD" stroke-width="1.8" />
    <text x="25" y="68" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">OLake Fusion</text>
  </g>

</svg>
