version: 2
updates:
  # Keep the workflow action pins current (they are pinned to major versions).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Version updates for npm. Docusaurus packages are pinned exactly and must move together, so they
  # are grouped into one PR; everything else is grouped by update type to keep the PR count low.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docusaurus:
        patterns: ['@docusaurus/*']
      minor-and-patch:
        update-types: ['minor', 'patch']
        exclude-patterns: ['@docusaurus/*']
    ignore:
      # Tailwind 4 is already in use, and React 19 is the supported baseline, so the old React major
      # ignore is gone: a React 20 PR is welcome once Docusaurus supports it. CI builds every
      # Dependabot PR; run `npm run typecheck` and `npm run lint:content` locally before merging.
      # Docusaurus 4 needs a coordinated migration (future.v4 flags, MDX, swizzles), not a bump:
      # the docusaurus group above only takes minor and patch releases of the 3.x line.
      - dependency-name: '@docusaurus/*'
        update-types: ['version-update:semver-major']
      # TypeScript 6/7 is a toolchain change: take it by hand after Docusaurus supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
