name: Test deployment

on:
  pull_request:
    branches:
      - master
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

permissions:
  contents: read

# A newer push to the same PR makes the older test build pointless.
concurrency:
  group: test-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # showLastUpdateTime / showLastUpdateAuthor read git history
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Test build website
        run: npm run build
      # Fails on a redirect loop, a redirect to a missing page, or more than 2,000 rules
      - name: Check the Cloudflare redirect rules
        run: node scripts/cloudflare/prepare-build.mjs build

      # A preview URL for the pull request. Off until the repository variable CLOUDFLARE_PREVIEWS
      # is "true". Pull requests from forks get no secrets, so they stop at the checks above.
      - name: Deploy a preview to Cloudflare
        id: preview
        if: vars.CLOUDFLARE_PREVIEWS == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.159.0'
          command: preview --name pr-${{ github.event.pull_request.number }}
      - name: Test the preview
        if: steps.preview.outputs.preview-url != ''
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview-url }}
        run: |
          echo "Preview: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          node scripts/cloudflare/test-deploy.mjs build "$PREVIEW_URL" --json test-deploy.json > /dev/null \
            || { node -e "const r=require('./test-deploy.json');console.log(r.allFailures.slice(0,50).join('\n'));"; exit 1; }
