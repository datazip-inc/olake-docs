name: Test deployment

on:
  pull_request:
    branches:
      - master
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on

permissions:
  contents: read

# A newer push to the same PR makes the older test build pointless.
concurrency:
  group: test-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-deploy:
    name: Test deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # showLastUpdateTime / showLastUpdateAuthor read git history
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Lint content
        # errors fail the job; warnings (existing style debt) are not printed in CI
        run: npm run lint:content -- --quiet
      - name: Typecheck
        run: npm run typecheck
      - name: Test build website
        run: npm run build
