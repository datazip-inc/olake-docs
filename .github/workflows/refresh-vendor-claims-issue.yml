name: Monthly vendor claims reminder

on:
  schedule:
    # 06:00 UTC on the 1st of every month
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  open-issue:
    name: Open the refresh issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open "Refresh vendor claims" issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          month="$(date -u +'%B %Y')"
          gh issue create \
            --title "Refresh vendor claims, ${month}" \
            --body "@zriyansh Run \`/refresh-vendor-claims\` in Claude Code from the repo root. It re-checks the dated price, plan, limit and licence claims in \`compare/\` and \`learn/\` and opens one PR. See \`.claude/skills/refresh-vendor-claims/SKILL.md\` and \`SOP.md\` section 5.7."
