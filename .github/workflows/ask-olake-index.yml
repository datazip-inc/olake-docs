name: Ask OLake index

# Rebuilds the search index of the Ask OLake bot (ask-olake/) from the site and from the docs of
# the code repositories, checks it against the test questions, and loads it into the bot's database.

on:
  push:
    branches:
      - master
  # Nightly: picks up what changed in the code repositories.
  schedule:
    - cron: '30 1 * * *'
  # A code repository can ask for a rebuild right after its docs change, by sending this event.
  repository_dispatch:
    types: [ask-olake-index]
  workflow_dispatch:

permissions:
  contents: read

# A newer run replaces one that is still building: only the latest content matters.
concurrency:
  group: ask-olake-index
  cancel-in-progress: true

jobs:
  index:
    name: Build and load the index
    # Off until the bot's Worker and database exist. Turn it on with the repository variable
    # ASK_OLAKE_INDEX set to "on", and the secrets CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN
    # (a token that may edit D1 and run Workers AI).
    if: vars.ASK_OLAKE_INDEX == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: olake-docs
    steps:
      # The index build reads the code repositories from the folders next to olake-docs.
      - uses: actions/checkout@v7
        with:
          path: olake-docs
          # showLastUpdateTime / showLastUpdateAuthor read git history
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: datazip-inc/olake-go
          path: olake-go
      - uses: actions/checkout@v7
        with:
          repository: datazip-inc/olake-ui
          path: olake-ui
      - uses: actions/checkout@v7
        with:
          repository: datazip-inc/olake-helm
          path: olake-helm
      - uses: actions/checkout@v7
        with:
          repository: datazip-inc/olake-fusion
          path: olake-fusion
      - uses: actions/setup-node@v7
        with:
          node-version-file: olake-docs/.nvmrc
          cache: npm
          cache-dependency-path: olake-docs/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
      - name: Test the bot
        run: npm run ask-olake:test
      # The vectors of the last build: only new and changed sections are embedded again.
      - uses: actions/cache@v5
        with:
          path: olake-docs/ask-olake/.wrangler/ingest/vectors.json
          key: ask-olake-vectors-${{ github.run_id }}
          restore-keys: ask-olake-vectors-
      - name: Build the index
        run: node ask-olake/ingest/build.ts
        env:
          # Reads the issues of the code repositories, which are public.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check the index against the test questions
        run: npm run ask-olake:check
      - name: Load the index into the bot's database
        run: npx wrangler d1 execute ask-olake --remote --yes -c ask-olake/wrangler.jsonc --file ask-olake/.wrangler/ingest/index.sql
