<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="620" viewBox="0 0 1720 620"><defs><marker id="ar193AE6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#193AE6"/></marker><marker id="ar059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker><marker id="ar33445A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#33445A"/></marker><marker id="ar94A3B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker><marker id="arDC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker><marker id="arD97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/></marker></defs><rect width="1720" height="620" fill="white"/><text x="56" y="46.14" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0B1220" text-anchor="start" font-weight="bold">The handoff: pin the log first, load, then replay</text><text x="56" y="70.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6B82" text-anchor="start">nothing that changes during the load is lost, and nothing lands twice</text><text x="1552" y="39.74" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#BAC5D4" text-anchor="start">olake.io</text><rect x="800" y="383" width="528" height="34" rx="8" fill="#FCE7C2" stroke="#D97706" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1064.0" y="368.072" font-family="Helvetica, Arial, sans-serif" font-size="10.8" fill="#9A5408" text-anchor="middle" font-weight="bold">overlap window — inserts deduplicated</text><rect x="1336" y="383" width="330" height="34" rx="8" fill="#CFF3E2"/><text x="1510.0" y="368.072" font-family="Helvetica, Arial, sans-serif" font-size="10.8" fill="#046B4D" text-anchor="middle" font-weight="bold">steady state — plain appends</text><polyline points="90,400 1670,400" fill="none" stroke="#33445A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#ar33445A)"/><circle cx="180" cy="400" r="13" fill="#193AE6" stroke="#FFFFFF" stroke-width="2"/><text x="180" y="404.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">1</text><text x="180.0" y="448.59" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#0B1220" text-anchor="middle" font-weight="bold">PreCDC pins the position</text><text x="180.0" y="469.74" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6B82" text-anchor="middle">LSN · binlog coords · resume token</text><circle cx="508" cy="400" r="13" fill="#193AE6" stroke="#FFFFFF" stroke-width="2"/><text x="508" y="404.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">2</text><text x="508.0" y="448.59" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#0B1220" text-anchor="middle" font-weight="bold">Chunked full load</text><text x="508.0" y="469.74" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6B82" text-anchor="middle">parallel, resumable</text><circle cx="836" cy="400" r="13" fill="#193AE6" stroke="#FFFFFF" stroke-width="2"/><text x="836" y="404.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">3</text><text x="836.0" y="448.59" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#0B1220" text-anchor="middle" font-weight="bold">Replay from the pin</text><text x="836.0" y="469.74" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6B82" text-anchor="middle">every mid-load change arrives</text><circle cx="1164" cy="400" r="13" fill="#193AE6" stroke="#FFFFFF" stroke-width="2"/><text x="1164" y="404.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><text x="1164.0" y="448.59" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#0B1220" text-anchor="middle" font-weight="bold">Overlap window</text><text x="1164.0" y="469.74" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6B82" text-anchor="middle">insert → op i → upsert</text><circle cx="1492" cy="400" r="13" fill="#193AE6" stroke="#FFFFFF" stroke-width="2"/><text x="1492" y="404.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">5</text><text x="1492.0" y="448.59" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#0B1220" text-anchor="middle" font-weight="bold">Steady state</text><text x="1492.0" y="469.74" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6B82" text-anchor="middle">insert → op c → append</text><rect x="96" y="232" width="168" height="34" rx="6" fill="#FFFFFF" stroke="#475A70" stroke-width="1.8"/><text x="124.0" y="252.7" font-family="Courier New" font-size="10.5" fill="#0B1220" text-anchor="middle" font-weight="bold">K1:I</text><line x1="152.0" y1="235" x2="152.0" y2="263" stroke="#D5DEE9" stroke-width="1.1"/><text x="180.0" y="252.7" font-family="Courier New" font-size="10.5" fill="#0B1220" text-anchor="middle" font-weight="bold">K2:U</text><line x1="208.0" y1="235" x2="208.0" y2="263" stroke="#D5DEE9" stroke-width="1.1"/><path d="M 269 242.0 L 281 249.0 L 269 256.0 Z" fill="#475A70"/><line x1="206.88" y1="226" x2="206.88" y2="272" stroke="#D97706" stroke-width="2.4"/><text x="207.88" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#D97706" text-anchor="middle" font-weight="bold">⚑</text><text x="206.88" y="197.536" font-family="Helvetica, Arial, sans-serif" font-size="10.4" fill="#9A5408" text-anchor="middle" font-weight="bold">pinned here</text><rect x="424" y="246" width="40" height="26" rx="6" fill="#059669" stroke="#059669" stroke-width="1.6"/><text x="444.0" y="262.6" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">✓</text><rect x="468" y="246" width="40" height="26" rx="6" fill="#059669" stroke="#059669" stroke-width="1.6"/><text x="488.0" y="262.6" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#FFFFFF" text-anchor="middle" font-weight="bold">✓</text><rect x="512" y="246" width="40" height="26" rx="6" fill="#193AE6" stroke="#193AE6" stroke-width="1.6"/><rect x="556" y="246" width="40" height="26" rx="6" fill="#FFFFFF" stroke="#8A9AB0" stroke-width="1.6"/><text x="504.0" y="299.536" font-family="Helvetica, Arial, sans-serif" font-size="10.4" fill="#5A6B82" text-anchor="middle">chunks run</text><rect x="756" y="232" width="168" height="34" rx="6" fill="#FFFFFF" stroke="#475A70" stroke-width="1.8"/><text x="784.0" y="252.7" font-family="Courier New" font-size="10.5" fill="#0B1220" text-anchor="middle" font-weight="bold">K1:I</text><line x1="812.0" y1="235" x2="812.0" y2="263" stroke="#D5DEE9" stroke-width="1.1"/><text x="840.0" y="252.7" font-family="Courier New" font-size="10.5" fill="#0B1220" text-anchor="middle" font-weight="bold">K2:U</text><rect x="869.5" y="233.5" width="53.0" height="31" rx="3" fill="#FCE7C2"/><line x1="868.0" y1="235" x2="868.0" y2="263" stroke="#D5DEE9" stroke-width="1.1"/><text x="896.0" y="252.7" font-family="Courier New" font-size="10.5" fill="#9A5408" text-anchor="middle" font-weight="bold">K9:I</text><path d="M 929 242.0 L 941 249.0 L 929 256.0 Z" fill="#475A70"/><line x1="759.36" y1="226" x2="759.36" y2="272" stroke="#D97706" stroke-width="2.4"/><text x="760.36" y="220" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#D97706" text-anchor="middle" font-weight="bold">⚑</text><text x="848.0" y="299.536" font-family="Helvetica, Arial, sans-serif" font-size="10.4" fill="#5A6B82" text-anchor="middle">replayed from ⚑</text><rect x="1092" y="240" width="76" height="30" rx="15.0" fill="#FCE7C2" stroke="#D97706" stroke-width="1.6"/><text x="1130.0" y="258.96" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9A5408" text-anchor="middle" font-weight="bold">op i</text><rect x="1180" y="240" width="92" height="30" rx="15.0" fill="#FFFFFF" stroke="#8A9AB0" stroke-width="1.6"/><text x="1226.0" y="258.96" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B1220" text-anchor="middle" font-weight="bold">upsert</text><rect x="1420" y="240" width="76" height="30" rx="15.0" fill="#FFFFFF" stroke="#8A9AB0" stroke-width="1.6"/><text x="1458.0" y="258.96" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B1220" text-anchor="middle" font-weight="bold">op c</text><rect x="1508" y="240" width="92" height="30" rx="15.0" fill="#CFF3E2" stroke="#059669" stroke-width="1.6"/><text x="1554.0" y="258.96" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#046B4D" text-anchor="middle" font-weight="bold">append</text><text x="860.0" y="585.375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6B82" text-anchor="middle" font-style="italic">PreCDC pins the log position before any data moves (1), the chunked load runs (2), and the log replays from exactly that pin (3). Until the first CDC session commits, inserts are tagged i and land as upserts (4); after that they append as plain</text><text x="860.0" y="601.625" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6B82" text-anchor="middle" font-style="italic">c (5).</text></svg>