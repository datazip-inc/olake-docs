<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="720" viewBox="0 0 1720 720"><defs><marker id="ar193AE6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#193AE6"/></marker><marker id="ar059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker><marker id="ar33445A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#33445A"/></marker><marker id="ar94A3B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker><marker id="arDC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker><marker id="arD97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/></marker></defs><rect width="1720" height="720" fill="white"/><text x="56" y="46.14" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0B1220" text-anchor="start" font-weight="bold">Every record carries its own provenance</text><text x="56" y="70.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6B82" text-anchor="start">OLake stamps four metadata columns onto each row, plus the exact log position for CDC</text><text x="1552" y="39.74" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#BAC5D4" text-anchor="start">olake.io</text><text x="58" y="142.91" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#33445A" text-anchor="start" font-weight="bold">source row, as the database has it</text><rect x="56" y="156" width="350" height="52" rx="2" fill="#FFFFFF" stroke="#475A70" stroke-width="1.6"/><rect x="56" y="156" width="350" height="27" rx="2" fill="#E6EBF2" stroke="#475A70" stroke-width="1.6"/><text x="64" y="173.1" font-family="Courier New" font-size="10.5" fill="#33445A" text-anchor="start" font-weight="bold">id</text><text x="114" y="173.1" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#33445A" text-anchor="start" font-weight="bold">customer</text><text x="214" y="173.1" font-family="Courier New" font-size="10.5" fill="#33445A" text-anchor="start" font-weight="bold">amount</text><text x="304" y="173.1" font-family="Courier New" font-size="10.5" fill="#33445A" text-anchor="start" font-weight="bold">updated_at</text><line x1="56" y1="183" x2="406" y2="183" stroke="#DEE5EE" stroke-width="1"/><text x="64" y="199.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">2</text><text x="114" y="199.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B1220" text-anchor="start">Bob</text><text x="214" y="199.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">340.00</text><text x="304" y="199.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">09:02:11</text><line x1="106" y1="156" x2="106" y2="208" stroke="#DEE5EE" stroke-width="1"/><line x1="206" y1="156" x2="206" y2="208" stroke="#DEE5EE" stroke-width="1"/><line x1="296" y1="156" x2="296" y2="208" stroke="#DEE5EE" stroke-width="1"/><polyline points="420,183 516,183" fill="none" stroke="#33445A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar33445A)"/><text x="468.0" y="170.6" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#33445A" text-anchor="middle">stamp</text><text x="542" y="142.91" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#9A5408" text-anchor="start" font-weight="bold">the same row, as OLake moves it</text><rect x="540" y="156" width="454" height="52" rx="2" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/><rect x="540" y="156" width="454" height="27" rx="2" fill="#FCE7C2" stroke="#D97706" stroke-width="1.6"/><text x="548" y="173.1" font-family="Courier New" font-size="10.5" fill="#9A5408" text-anchor="start" font-weight="bold">_olake_id</text><text x="644" y="173.1" font-family="Courier New" font-size="10.5" fill="#9A5408" text-anchor="start" font-weight="bold">_op_type</text><text x="732" y="173.1" font-family="Courier New" font-size="10.5" fill="#9A5408" text-anchor="start" font-weight="bold">_olake_timestamp</text><text x="872" y="173.1" font-family="Courier New" font-size="10.5" fill="#9A5408" text-anchor="start" font-weight="bold">_cdc_timestamp</text><line x1="540" y1="183" x2="994" y2="183" stroke="#DEE5EE" stroke-width="1"/><text x="548" y="199.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">b7c2…</text><text x="644" y="199.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">c</text><text x="732" y="199.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">09:02:14</text><text x="872" y="199.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">09:02:11</text><line x1="636" y1="156" x2="636" y2="208" stroke="#DEE5EE" stroke-width="1"/><line x1="724" y1="156" x2="724" y2="208" stroke="#DEE5EE" stroke-width="1"/><line x1="864" y1="156" x2="864" y2="208" stroke="#DEE5EE" stroke-width="1"/><text x="1132" y="142.91" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#33445A" text-anchor="start" font-weight="bold">plus the source&#x27;s own position</text><rect x="1130" y="156" width="150" height="52" rx="2" fill="#FFFFFF" stroke="#475A70" stroke-width="1.6"/><rect x="1130" y="156" width="150" height="27" rx="2" fill="#E6EBF2" stroke="#475A70" stroke-width="1.6"/><text x="1138" y="173.1" font-family="Courier New" font-size="10.5" fill="#33445A" text-anchor="start" font-weight="bold">_cdc_lsn</text><line x1="1130" y1="183" x2="1280" y2="183" stroke="#DEE5EE" stroke-width="1"/><text x="1138" y="199.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">0/1A2B3C4D</text><text x="1130" y="257.49399999999997" font-family="Helvetica, Arial, sans-serif" font-size="10.6" fill="#5A6B82" text-anchor="start">one column per source: MySQL writes binlog file and position, MongoDB a resume</text><text x="1130" y="271.27399999999994" font-family="Helvetica, Arial, sans-serif" font-size="10.6" fill="#5A6B82" text-anchor="start">token, Kafka partition and offset</text><text x="56" y="264.66" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6B82" text-anchor="start">_olake_id is a hash of the primary key — the identity the destination deduplicates and upserts on. _op_type is how the writer knows what to do with the row.</text><text x="860.0" y="685.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6B82" text-anchor="middle" font-style="italic">Because the operation type travels with the record, the writer never has to guess: r and c append, u and d delete by _olake_id, and i is the one that makes the full-load-to-CDC overlap safe to replay.</text><text x="58" y="342.91" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0F2BB5" text-anchor="start" font-weight="bold">the five operation types</text><rect x="56" y="356" width="914" height="152" rx="2" fill="#FFFFFF" stroke="#193AE6" stroke-width="1.6"/><rect x="56" y="356" width="914" height="27" rx="2" fill="#DCE4FE" stroke="#193AE6" stroke-width="1.6"/><text x="64" y="373.1" font-family="Courier New" font-size="10.5" fill="#0F2BB5" text-anchor="start" font-weight="bold">_op_type</text><text x="160" y="373.1" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0F2BB5" text-anchor="start" font-weight="bold">emitted by</text><text x="328" y="373.1" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0F2BB5" text-anchor="start" font-weight="bold">meaning</text><text x="728" y="373.1" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#0F2BB5" text-anchor="start" font-weight="bold">how it lands</text><line x1="56" y1="383" x2="970" y2="383" stroke="#DEE5EE" stroke-width="1"/><text x="64" y="399.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">r</text><text x="160" y="399.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B1220" text-anchor="start">full load</text><text x="328" y="399.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B1220" text-anchor="start">row read during a backfill scan</text><text x="728" y="399.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B1220" text-anchor="start">plain append</text><line x1="56" y1="408" x2="970" y2="408" stroke="#DEE5EE" stroke-width="1"/><text x="64" y="424.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">c</text><text x="160" y="424.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B1220" text-anchor="start">CDC</text><text x="328" y="424.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B1220" text-anchor="start">insert captured from the change log</text><text x="728" y="424.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B1220" text-anchor="start">plain append</text><rect x="57" y="433" width="912" height="25" rx="0" fill="#FCE7C2"/><line x1="56" y1="433" x2="970" y2="433" stroke="#DEE5EE" stroke-width="1"/><text x="64" y="449.3" font-family="Courier New" font-size="11" fill="#9A5408" text-anchor="start">i</text><text x="160" y="449.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9A5408" text-anchor="start">CDC</text><text x="328" y="449.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9A5408" text-anchor="start">insert that may duplicate a backfilled row</text><text x="728" y="449.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9A5408" text-anchor="start">equality delete + insert</text><line x1="56" y1="458" x2="970" y2="458" stroke="#DEE5EE" stroke-width="1"/><text x="64" y="474.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">u</text><text x="160" y="474.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B1220" text-anchor="start">CDC · incremental</text><text x="328" y="474.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B1220" text-anchor="start">new version of an existing row</text><text x="728" y="474.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B1220" text-anchor="start">equality delete + insert</text><line x1="56" y1="483" x2="970" y2="483" stroke="#DEE5EE" stroke-width="1"/><text x="64" y="499.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">d</text><text x="160" y="499.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B1220" text-anchor="start">CDC</text><text x="328" y="499.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B1220" text-anchor="start">delete captured from the change log</text><text x="728" y="499.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B1220" text-anchor="start">equality delete</text><line x1="152" y1="356" x2="152" y2="508" stroke="#DEE5EE" stroke-width="1"/><line x1="320" y1="356" x2="320" y2="508" stroke="#DEE5EE" stroke-width="1"/><line x1="720" y1="356" x2="720" y2="508" stroke="#DEE5EE" stroke-width="1"/><rect x="1080" y="356" width="320" height="74" rx="9" fill="#FCE7C2" stroke="#D97706" stroke-width="1.8"/><text x="1240.0" y="390.389" text-anchor="middle" xml:space="preserve"><tspan font-family="Courier New" font-size="12.5" fill="#9A5408" font-weight="bold">i</tspan><tspan font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0B1220" font-weight="bold"> only exists in the overlap window</tspan></text><text x="1240.0" y="405.371" text-anchor="middle" xml:space="preserve"><tspan font-family="Helvetica, Arial, sans-serif" font-size="10.8" fill="#5A6B82">once it closes, inserts arrive as plain </tspan><tspan font-family="Courier New" font-size="10.8" fill="#9A5408" font-weight="bold">c</tspan></text><rect x="1080" y="448" width="320" height="74" rx="9" fill="#E6EBF2" stroke="#475A70" stroke-width="1.8"/><text x="1240.0" y="482.389" text-anchor="middle" xml:space="preserve"><tspan font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0B1220" font-weight="bold">Incremental never emits </tspan><tspan font-family="Courier New" font-size="12.5" fill="#0F2BB5" font-weight="bold">d</tspan></text><text x="1240.0" y="497.371" font-family="Helvetica, Arial, sans-serif" font-size="10.8" fill="#5A6B82" text-anchor="middle">a row deleted at the source just stops appearing</text><rect x="1080" y="540" width="320" height="74" rx="9" fill="#E6EBF2" stroke="#475A70" stroke-width="1.8"/><text x="1240.0" y="574.389" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0B1220" text-anchor="middle" font-weight="bold">CDC has no such gap</text><text x="1240.0" y="589.371" font-family="Helvetica, Arial, sans-serif" font-size="10.8" fill="#5A6B82" text-anchor="middle">a delete is a real event on the change log</text><text x="1440" y="369.89" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6B82" text-anchor="start">This is why the destination never has</text><text x="1440" y="384.19" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6B82" text-anchor="start">to diff anything: the record already</text><text x="1440" y="398.49" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5A6B82" text-anchor="start">says what it is.</text></svg>