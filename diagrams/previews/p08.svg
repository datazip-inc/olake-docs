etica, Arial, sans-serif" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="bold">data file</text><text x="1592.0" y="214.92000000000002" font-family="Helvetica, Arial, sans-serif" font-size="10.4" fill="#5A6B82" text-anchor="middle">id 2 · Bob</text><text x="1592.0" y="228.85600000000002" text-anchor="middle" xml:space="preserve"><tspan font-family="Helvetica, Arial, sans-serif" font-size="10.4" fill="#5A6B82">op </tspan><tspan font-family="Courier New" font-size="10.4" fill="#0B1220" font-weight="bold">c</tspan></text><polyline points="1240,310.5 1310,210.0" fill="none" stroke="#33445A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar33445A)"/><polyline points="1217.0,288 1217,136 1592,136 1592.0,168" fill="none" stroke="#33445A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar33445A)"/><rect x="1330" y="320" width="334" height="62" rx="9" fill="#CFF3E2" stroke="#059669" stroke-width="1.8"/><text x="1497.0" y="348.389" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0B1220" text-anchor="middle" font-weight="bold">One Iceberg commit</text><text x="1497.0" y="363.371" font-family="Helvetica, Arial, sans-serif" font-size="10.8" fill="#5A6B82" text-anchor="middle">delete + data — all, or nothing</text><circle cx="1330" cy="320" r="13" fill="#193AE6" stroke="#FFFFFF" stroke-width="2"/><text x="1330" y="324.6" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="bold">4</text><polyline points="1394.0,252 1403.48,320" fill="none" stroke="#059669" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#ar059669)"/><polyline points="1592.0,252 1590.52,320" fill="none" stroke="#059669" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#ar059669)"/><text x="1336" y="456.91" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#046B4D" text-anchor="start" font-weight="bold">destination table (result)</text><rect x="1334" y="470" width="326" height="102" rx="2" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/><rect x="1334" y="470" width="326" height="27" rx="2" fill="#CFF3E2" stroke="#059669" stroke-width="1.6"/><text x="1342" y="487.1" font-family="Courier New" font-size="10.5" fill="#046B4D" text-anchor="start" font-weight="bold">_olake_id</text><text x="1434" y="487.1" font-family="Courier New" font-size="10.5" fill="#046B4D" text-anchor="start" font-weight="bold">id</text><text x="1478" y="487.1" font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#046B4D" text-anchor="start" font-weight="bold">customer</text><text x="1578" y="487.1" font-family="Courier New" font-size="10.5" fill="#046B4D" text-anchor="start" font-weight="bold">_op_type</text><line x1="1334" y1="497" x2="1660" y2="497" stroke="#DEE5EE" stroke-width="1"/><text x="1342" y="513.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">a3f1…</text><text x="1434" y="513.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">1</text><text x="1478" y="513.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B1220" text-anchor="start">Alice</text><text x="1578" y="513.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">r</text><rect x="1335" y="522" width="324" height="25" rx="0" fill="#CFF3E2"/><line x1="1334" y1="522" x2="1660" y2="522" stroke="#DEE5EE" stroke-width="1"/><text x="1342" y="538.3" font-family="Courier New" font-size="11" fill="#046B4D" text-anchor="start">b7c2…</text><text x="1434" y="538.3" font-family="Courier New" font-size="11" fill="#046B4D" text-anchor="start">2</text><text x="1478" y="538.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#046B4D" text-anchor="start">Bob</text><text x="1578" y="538.3" font-family="Courier New" font-size="11" fill="#046B4D" text-anchor="start">c</text><line x1="1334" y1="547" x2="1660" y2="547" stroke="#DEE5EE" stroke-width="1"/><text x="1342" y="563.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">e91d…</text><text x="1434" y="563.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">3</text><text x="1478" y="563.3" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0B1220" text-anchor="start">Dan</text><text x="1578" y="563.3" font-family="Courier New" font-size="11" fill="#0B1220" text-anchor="start">r</text><line x1="1426" y1="470" x2="1426" y2="572" stroke="#DEE5EE" stroke-width="1"/><line x1="1470" y1="470" x2="1470" y2="572" stroke="#DEE5EE" stroke-width="1"/><line x1="1570" y1="470" x2="1570" y2="572" stroke="#DEE5EE" stroke-width="1"/><text x="1336" y="592.736" font-family="Helvetica, Arial, sans-serif" font-size="10.4" fill="#5A6B82" text-anchor="start">one row for id 2 — not two</text><polyline points="1497.0,382 1497,470" fill="none" stroke="#059669" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#ar059669)"/><text x="860.0" y="765.375" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6B82" text-anchor="middle" font-style="italic">The backfill writes Bob as a plain append (op r) and the replay hands him over again inside the overlap window (op i). Because both hash to the same _olake_id, the writer emits an equality delete plus a fresh data file, one commit applies both,</text><text x="860.0" y="781.625" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6B82" text-anchor="middle" font-style="italic">and the table ends with a single row 2.</text></svg>