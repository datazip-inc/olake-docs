231.6" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#046B4D" text-anchor="middle">place files</text><polyline points="1256,442 1334,452" fill="none" stroke="#33445A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar33445A)"/><text x="1296" y="433.6" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#33445A" text-anchor="middle">commit</text><text x="860.0" y="625.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6B82" text-anchor="middle" font-style="italic">With arrow_writes enabled the Go process serializes batches straight to Iceberg-compliant Parquet and ships finished files over local gRPC; the JVM only registers them and commits, so no records cross the boundary one at a time.</text></svg>