<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="680" viewBox="0 0 1720 680"><defs><marker id="ar193AE6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#193AE6"/></marker><marker id="ar059669" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/></marker><marker id="ar33445A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#33445A"/></marker><marker id="ar94A3B8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8"/></marker><marker id="arDC2626" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#DC2626"/></marker><marker id="arD97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D97706"/></marker></defs><rect width="1720" height="680" fill="white"/><text x="56" y="46.14" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#0B1220" text-anchor="start" font-weight="bold">Exactly-once delivery with no coordinator</text><text x="56" y="70.25" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6B82" text-anchor="start">each commit writes the data and the record of the data, in one Iceberg transaction</text><text x="1552" y="39.74" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#BAC5D4" text-anchor="start">olake.io</text><rect x="56" y="140" width="372" height="440" rx="16" fill="#EDFAF3" stroke="#059669" stroke-width="1.6"/><rect x="72" y="126" width="205.70000000000002" height="28" rx="14" fill="#059669"/><text x="174.85000000000002" y="144.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">One Iceberg transaction</text><text x="74" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6B82" text-anchor="start">staged together, visible together</text><path d="M 104 194 L 376 194 L 388 206 L 388 286 L 104 286 Z" fill="#FFFFFF" stroke="#8A9AB0" stroke-width="1.3"/><path d="M 100 198 L 372 198 L 384 210 L 384 290 L 100 290 Z" fill="#FFFFFF" stroke="#8A9AB0" stroke-width="1.3"/><path d="M 96 202 L 366 202 L 380 216 L 380 294 L 96 294 Z" fill="#FFFFFF" stroke="#8A9AB0" stroke-width="1.8"/><path d="M 366 202 L 366 216 L 380 216" fill="none" stroke="#8A9AB0" stroke-width="1.3"/><text x="238.0" y="238.50400000000002" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="bold">Data files</text><text x="238.0" y="252.92000000000002" font-family="Helvetica, Arial, sans-serif" font-size="10.4" fill="#5A6B82" text-anchor="middle">new rows, Iceberg-compliant</text><text x="238.0" y="266.856" font-family="Helvetica, Arial, sans-serif" font-size="10.4" fill="#5A6B82" text-anchor="middle">Parquet</text><path d="M 104 312 L 376 312 L 388 324 L 388 404 L 104 404 Z" fill="#FFFFFF" stroke="#8A9AB0" stroke-width="1.3"/><path d="M 100 316 L 372 316 L 384 328 L 384 408 L 100 408 Z" fill="#FFFFFF" stroke="#8A9AB0" stroke-width="1.3"/><path d="M 96 320 L 366 320 L 380 334 L 380 412 L 96 412 Z" fill="#FFFFFF" stroke="#8A9AB0" stroke-width="1.8"/><path d="M 366 320 L 366 334 L 380 334" fill="none" stroke="#8A9AB0" stroke-width="1.3"/><text x="238.0" y="356.50399999999996" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#0B1220" text-anchor="middle" font-weight="bold">Delete files</text><text x="238.0" y="370.91999999999996" font-family="Helvetica, Arial, sans-serif" font-size="10.4" fill="#5A6B82" text-anchor="middle">equality deletes</text><text x="238.0" y="384.85599999999994" font-family="Helvetica, Arial, sans-serif" font-size="10.4" fill="#5A6B82" text-anchor="middle">positional deletes</text><rect x="96" y="438" width="284" height="86" rx="9" fill="#FCE7C2" stroke="#D97706" stroke-width="1.8"/><g transform="translate(112,467.0) scale(1.1666666666666667)"><path d="M6 3h8l5 5v13H6z" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 3v5h5" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.6 11.6h5.2v6.2l-2.6-2-2.6 2z" fill="#D97706"/></g><text x="154" y="471.153" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0B1220" text-anchor="start" font-weight="bold">olake_2pc</text><text x="154" y="486.135" font-family="Helvetica, Arial, sans-serif" font-size="10.8" fill="#5A6B82" text-anchor="start">committed thread IDs · last log</text><text x="154" y="500.60699999999997" font-family="Helvetica, Arial, sans-serif" font-size="10.8" fill="#5A6B82" text-anchor="start">position · dedup_inserts</text><text x="238.0" y="547.692" font-family="Helvetica, Arial, sans-serif" font-size="10.8" fill="#5A6B82" text-anchor="middle" font-style="italic">all three become visible together, or none of them</text><text x="238.0" y="561.732" font-family="Helvetica, Arial, sans-serif" font-size="10.8" fill="#5A6B82" text-anchor="middle" font-style="italic">at all</text><rect x="700" y="150" width="440" height="260" rx="16" fill="#EDFAF3" stroke="#059669" stroke-width="1.6"/><rect x="716" y="136" width="126.7" height="28" rx="14" fill="#059669"/><text x="779.35" y="154.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Iceberg table</text><text x="718" y="186" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6B82" text-anchor="start">all-or-nothing</text><rect x="732" y="216" width="376" height="62" rx="9" fill="#CFF3E2" stroke="#059669" stroke-width="1.8"/><g transform="translate(746,234.0) scale(1.0833333333333333)"><rect x="2.5" y="4.5" width="19" height="15" rx="1.6" fill="none" stroke="#059669" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 9.6h19M9 9.6v9.9M15 9.6v9.9" fill="none" stroke="#059669" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g><text x="782" y="244.886" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0B1220" text-anchor="start" font-weight="bold">committed data</text><text x="782" y="259.202" font-family="Helvetica, Arial, sans-serif" font-size="10.4" fill="#5A6B82" text-anchor="start">queryable the moment the swap lands</text><g transform="translate(1064,234.0) scale(1.0833333333333333) translate(-0.0,-0.0)"><path d="M12 2.6l5.4 8.1H6.6z" fill="#5AD0E6"/><path d="M12 2.6l5.4 8.1H12z" fill="#1B9CC4"/><path d="M2.9 11.9h18.2l-4.5 6.3-4.7 3.4-3.6-4.3z" fill="#2F6EA8"/><path d="M12 11.9h9.1l-4.5 6.3-4.6 3.4z" fill="#24527D"/><path d="M1.6 11.2h20.8" stroke="#9FE0EE" stroke-width="1.4" stroke-linecap="round"/></g><rect x="732" y="300" width="376" height="62" rx="9" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/><g transform="translate(748,317.0) scale(1.1666666666666667)"><rect x="4.4" y="10.4" width="15.2" height="10.4" rx="2.2" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 10.4V7.9a4 4 0 0 1 8 0v2.5" fill="none" stroke="#D97706" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g><text x="790" y="328.389" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#0B1220" text-anchor="start" font-weight="bold">olake_2pc</text><text x="790" y="343.371" font-family="Helvetica, Arial, sans-serif" font-size="10.8" fill="#5A6B82" text-anchor="start">the ledger, inside the table itself</text><polyline points="434,300 694,288" fill="none" stroke="#059669" stroke-width="2.6" stroke-linejoin="round" marker-end="url(#ar059669)"/><text x="562" y="279.6" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#046B4D" text-anchor="middle">single atomic swap</text><rect x="700" y="500" width="240" height="74" rx="6" fill="#DCE4FE" stroke="#193AE6" stroke-width="1.8"/><g transform="translate(915,507) scale(0.7083333333333334)"><rect x="7" y="3.4" width="14.6" height="17.2" rx="1.2" fill="none" stroke="#193AE6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><rect x="2.4" y="7" width="8.6" height="3.6" rx="0.9" fill="none" stroke="#193AE6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><rect x="2.4" y="13.4" width="8.6" height="3.6" rx="0.9" fill="none" stroke="#193AE6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(718,523.0) scale(1.1666666666666667)"><circle cx="10.4" cy="10.4" r="6.4" fill="none" stroke="#193AE6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.1 15.1l5.3 5.3" fill="none" stroke="#193AE6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g><text x="760" y="534.574" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1220" text-anchor="start" font-weight="bold">Next sync run</text><text x="760" y="549.7059999999999" font-family="Helvetica, Arial, sans-serif" font-size="10.8" fill="#5A6B82" text-anchor="start">opens the table first</text><rect x="1030" y="500" width="300" height="74" rx="6" fill="#DCE4FE" stroke="#193AE6" stroke-width="1.8"/><g transform="translate(1305,507) scale(0.7083333333333334)"><rect x="7" y="3.4" width="14.6" height="17.2" rx="1.2" fill="none" stroke="#193AE6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><rect x="2.4" y="7" width="8.6" height="3.6" rx="0.9" fill="none" stroke="#193AE6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><rect x="2.4" y="13.4" width="8.6" height="3.6" rx="0.9" fill="none" stroke="#193AE6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(1048,523.0) scale(1.1666666666666667)"><path d="M12 2.6l8.2 3v6.5c0 5-3.5 8.7-8.2 9.5-4.7-.8-8.2-4.5-8.2-9.5V5.6z" fill="none" stroke="#193AE6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.3 12.1l2.7 2.7 5-5.5" fill="none" stroke="#193AE6" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1090" y="534.574" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0B1220" text-anchor="start" font-weight="bold">Skips committed work</text><text x="1090" y="549.7059999999999" font-family="Helvetica, Arial, sans-serif" font-size="10.8" fill="#5A6B82" text-anchor="start">chunk IDs and positions already done</text><polyline points="870,366 820,456 820.0,500" fill="none" stroke="#D97706" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arD97706)"/><text x="1040" y="433.6" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9A5408" text-anchor="middle">reads olake_2pc before doing anything</text><polyline points="940,537.0 1030,537.0" fill="none" stroke="#33445A" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ar33445A)"/><text x="1200" y="230.38500000000002" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6B82" text-anchor="start">No external coordinator and no transaction log of its own: the</text><text x="1200" y="245.335" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6B82" text-anchor="start">committed table is the only thing OLake trusts on restart. If the</text><text x="1200" y="260.285" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A6B82" text-anchor="start">table is ahead of state.json, the table wins.</text><text x="860.0" y="645.5" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#5A6B82" text-anchor="middle" font-style="italic">Every recovery path asks the destination the same question before it starts: what did you last durably record? Trusting the committed table over the local state file is what lets a plain stateless binary promise exactly-once.</text></svg>